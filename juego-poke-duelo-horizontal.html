<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════
     JUEGO PARA REEL · POKÉ-DUELO
     Versión horizontal 1920 × 1080 para YouTube. Solo la zona JUEGO es real/interactiva.
     Teclas:  R = modo grabación 1:1   G = ocultar guías de zonas virtuales
              P = mostrar/ocultar panel de control
     Panel en otra pestaña: abrir este mismo archivo con #panel al final.
     ═══════════════════════════════════════════════════════════════ -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poké-Duelo · Horizontal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* ── ESQUELETO DEL REEL (ajustable) ── */
  --h-banner-top: 0px;
  --h-cams: 482px;
  --h-game: 598px;
  --h-banner-bottom: 0px;
  --reel-w: 1920px;

  /* ── Estética del juego ── */
  --ink: #16161f;
  --ok: #3fbf4f;
  --no: #e0413b;
  --gold: #ffd84a;
  /* Bungee conserva un aire arcade sin atribuirle una marca ajena. */
  --pixel: 'Bungee', 'Press Start 2P', system-ui, sans-serif;
}

html,body{margin:0;height:100%;background:#0d0d10;overflow:hidden}
body.rec{overflow:auto}

/* ── REEL ── */
#reel{
  position:absolute; left:50%; top:50%;
  width:var(--reel-w);
  transform-origin:center center;
  display:flex; flex-direction:column;
}
body.rec #reel{position:relative; left:0; top:0; transform:none !important}

/* ── ZONAS VIRTUALES ── */
.virtual{
  flex:none; position:relative; width:100%;
  pointer-events:none; user-select:none;
  display:flex; align-items:center; justify-content:center;
  font:600 22px/1 system-ui, sans-serif; letter-spacing:.25em;
  color:rgba(255,255,255,.28);
}
.virtual::after{content:''; position:absolute; inset:8px; border:3px dashed rgba(255,255,255,.2); border-radius:4px}
#v-top{height:var(--h-banner-top); background:#8e1622}
#v-cams{height:var(--h-cams); background:#2a2a2a}
#v-bottom{height:var(--h-banner-bottom); background:#8e1622}
body.horizontal #v-top, body.horizontal #v-bottom{display:none}
body.horizontal #v-cams{height:482px; background:#181a20; color:rgba(255,255,255,.35)}
body.clean .virtual span, body.clean .virtual::after{display:none}

/* ── JUEGO ── */
#game{
  flex:none; position:relative; width:var(--reel-w); height:var(--h-game);
  overflow:hidden; font-family:var(--pixel); color:#fff;
  background:url('nature-1768605061922-3261.jpg') center center / cover no-repeat;
}
.cloud{display:none}
.cloud::before,.cloud::after{content:''; position:absolute; background:#fff; border-radius:50%}
.cloud::before{width:56px; height:56px; left:18%; top:-28px}
.cloud::after{width:40px; height:40px; left:52%; top:-18px}

.half{position:absolute; top:0; bottom:0; width:960px; padding:16px 190px; box-sizing:border-box;
  display:flex; flex-direction:column; justify-content:center; z-index:1}
.half.l{left:0} .half.r{right:0}
.divider{position:absolute; left:955px; top:0; bottom:0; width:10px; background:var(--ink);
  box-shadow:-3px 0 0 #fff, 3px 0 0 #fff; z-index:2}

/* Velo suave: la foto se mantiene visible y los datos siguen siendo legibles. */
#game::before{content:''; position:absolute; inset:0; z-index:0;
  background:linear-gradient(180deg,rgba(9,24,34,.22),rgba(8,20,18,.38));}

.outline{text-shadow:
  -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
   0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink),
   0 7px 0 rgba(0,0,0,.42), 4px 10px 8px rgba(0,0,0,.4)}
/* Un solo intento por lado: sprite grande + 5 validaciones */
.tile{box-sizing:border-box; border:5px solid var(--ink); border-radius:8px;
  box-shadow:6px 6px 0 rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; gap:16px; position:relative}
.tile.empty{background:rgba(255,255,255,.16); border:4px dashed rgba(255,255,255,.65); box-shadow:none}
.tile.ok{background:var(--ok)}
.tile.no{background:var(--no)}
.tile.sprite{width:220px; height:220px; margin:0 auto; overflow:hidden}
.tile.sprite img{width:250px; height:250px; flex:none; image-rendering:pixelated}
.tile.sprite .q{font-size:110px; color:rgba(255,255,255,.75)}
.checks{display:flex; flex-direction:column; gap:10px; margin-top:20px}
.half.l .checks{transform:translateX(-10px)}
.half.r .checks{transform:translateX(-15px)}
.check{display:grid; grid-template-columns:120px 1fr; gap:16px; align-items:center; height:68px}
.check .lbl{font-size:20px; text-align:right}
.check .lbl.long{font-size:16px}
.check .tile{height:68px}
.check.types .type-tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; min-width:0}
.check.types .type-tiles .tile{min-width:0; padding-left:8px; padding-right:8px}
.tb{font-size:18px; padding:12px 14px 11px; border:4px solid rgba(0,0,0,.5); border-radius:6px; text-shadow:2px 2px 0 rgba(0,0,0,.55); white-space:nowrap; letter-spacing:-.025em}
.none{font-size:30px}
.big{font-size:34px}
.sw{width:52px; height:52px; flex:none; border:4px solid var(--ink); border-radius:6px; box-shadow:inset -6px -6px 0 rgba(0,0,0,.18)}
.cname{font-size:18px}

.anim-pop{animation:pop .48s both}
.anim-flip{animation:flip .62s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:none}}
@keyframes flip{0%{transform:perspective(500px) rotateX(-90deg)}65%{transform:perspective(500px) rotateX(14deg)}100%{transform:none}}

.half.win .tile{box-shadow:0 0 0 6px var(--gold), 6px 6px 0 6px rgba(0,0,0,.35)}
.resultbanner{position:absolute; left:0; right:0; top:220px; text-align:center; font-size:34px; z-index:3}
.resultbanner.win{color:var(--gold)}
.resultbanner.try{color:#fff; font-size:30px}
.resultbanner.anim{animation:bannerIn .72s both}
@keyframes bannerIn{0%{transform:scale(0) rotate(-8deg)}70%{transform:scale(1.15) rotate(2deg)}100%{transform:none}}

/* ── Tablero horizontal tipo Wordle ── */
body.horizontal .half{padding:16px 30px; display:block}
body.horizontal .wordle-board{height:100%; display:flex; flex-direction:column; min-width:0}
body.horizontal .wordle-head{display:flex; align-items:center; justify-content:space-between; margin:0 4px 14px; min-height:38px}
body.horizontal .wordle-head h3{margin:0; font-size:24px; letter-spacing:.055em}
body.horizontal .wordle-head span{font-size:13px; padding:6px 9px; border-radius:999px; background:rgba(0,0,0,.36); border:1px solid rgba(255,255,255,.23); opacity:.92}
body.horizontal .wordle-labels,.wordle-row{display:grid; grid-template-columns:112px 282px repeat(3, minmax(0,1fr)); gap:9px; align-items:center}
body.horizontal .wordle-labels{padding:0 10px 8px; font-size:12px; letter-spacing:.05em; color:rgba(255,255,255,.8); text-align:center}
body.horizontal .wordle-labels span:first-child{text-align:center}
body.horizontal .wordle-list{display:flex; flex-direction:column; gap:9px; overflow:hidden; padding:3px 5px 8px}
body.horizontal .wordle-row{min-height:64px; padding:7px 9px; box-sizing:border-box; background:linear-gradient(100deg,rgba(7,17,24,.72),rgba(12,31,35,.54)); border:2px solid rgba(255,255,255,.4); border-radius:10px; box-shadow:0 5px 10px rgba(0,0,0,.22)}
/* Acierto: marco dorado. En el reveal aparece recién al final, junto con el cartel, para no adelantar el resultado. */
body.horizontal .wordle-row.solved{border-color:var(--gold); box-shadow:inset 0 0 0 5px var(--gold),inset 0 0 26px rgba(255,216,74,.5),0 8px 18px rgba(0,0,0,.36)}
body.horizontal .wordle-row.solved.new{animation:winFrame .6s both; animation-delay:var(--reveal-end)}
/* Marco interior: la lista recorta todo lo que sale de la fila. */
@keyframes winFrame{
  0%{border-color:rgba(255,255,255,.72); box-shadow:inset 0 0 0 0 var(--gold),inset 0 0 0 rgba(255,216,74,0),0 8px 18px rgba(0,0,0,.36)}
  60%{border-color:var(--gold); box-shadow:inset 0 0 0 7px var(--gold),inset 0 0 40px rgba(255,216,74,.75),0 8px 18px rgba(0,0,0,.36)}
  100%{border-color:var(--gold); box-shadow:inset 0 0 0 5px var(--gold),inset 0 0 26px rgba(255,216,74,.5),0 8px 18px rgba(0,0,0,.36)}}
/* Cartel de resultado del último intento, como en la versión vertical. */
body.horizontal .wordle-result{font-size:24px; letter-spacing:.04em; white-space:nowrap; color:#fff}
body.horizontal .wordle-result.win{color:var(--gold); font-size:30px}
body.horizontal .wordle-result.anim{animation:bannerIn .72s both; animation-delay:var(--reveal-end)}
body.horizontal .wordle-poke{width:58px; height:58px; margin:auto; display:flex; align-items:center; justify-content:center; overflow:hidden; box-sizing:border-box; border:3px solid var(--ink); border-radius:8px; background:rgba(255,255,255,.25); box-shadow:inset 0 2px 0 rgba(255,255,255,.34),0 3px 0 rgba(0,0,0,.3)}
body.horizontal .wordle-poke img{width:68px; height:68px; image-rendering:pixelated; flex:none}
body.horizontal .wordle-row.recent{min-height:112px; border-color:rgba(255,255,255,.72); background:linear-gradient(100deg,rgba(10,32,42,.92),rgba(21,62,57,.76)); box-shadow:0 8px 18px rgba(0,0,0,.36)}
body.horizontal .wordle-row.recent .wordle-poke{width:102px; height:102px; border-width:4px; border-radius:10px; box-shadow:inset 0 3px 0 rgba(255,255,255,.38),0 5px 0 rgba(0,0,0,.33)}
body.horizontal .wordle-row.recent .wordle-poke img{width:116px; height:116px}
body.horizontal .wordle-row.recent .wordle-cell{min-height:74px; border-width:4px; gap:8px; padding:0 6px}
body.horizontal .wordle-row.recent .wordle-cell .tb{font-size:15px; padding:9px 10px 8px}
body.horizontal .wordle-row.recent .wordle-cell .big{font-size:23px}
body.horizontal .wordle-row.recent .wordle-cell .cname{font-size:14px}
body.horizontal .wordle-types{display:grid; grid-template-columns:1fr 1fr; gap:6px}
body.horizontal .wordle-cell{min-height:46px; display:flex; align-items:center; justify-content:center; gap:8px; padding:0 6px; box-sizing:border-box; border:3px solid var(--ink); border-radius:7px; background:var(--no); box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.3); font-size:16px; text-align:center; overflow:hidden}
body.horizontal .wordle-cell.ok{background:var(--ok)}
body.horizontal .wordle-cell.no{background:var(--no)}
body.horizontal .wordle-cell.empty{background:rgba(255,255,255,.17); border-style:dashed; color:rgba(255,255,255,.75); box-shadow:none}
body.horizontal .wordle-cell .tb{font-size:13px; padding:7px 8px 6px; border-width:2px; letter-spacing:.01em}
body.horizontal .wordle-cell .big{font-size:18px; letter-spacing:.04em}
body.horizontal .wordle-cell .cname{font-size:13px; letter-spacing:.025em}
body.horizontal .wordle-cell .sw{width:30px; height:30px; border-width:3px}
.arrow{margin-left:.3em; font-family:system-ui, sans-serif}
#cats-panel .line{margin-top:6px}
#panel select{flex:1; min-width:0; background:#14151b; color:#fff; border:1px solid #3a3b46; border-radius:7px; padding:7px 9px; font:inherit}
body.horizontal .wordle-empty{flex:1; display:flex; align-items:center; justify-content:center; border:3px dashed rgba(255,255,255,.55); border-radius:10px; color:rgba(255,255,255,.82); font-size:20px; text-align:center; padding:18px}
body.horizontal .wordle-row.new > *{animation:flip .62s both}
body.horizontal .wordle-row.new > *:nth-child(1){animation-name:pop; animation-delay:0ms}
body.horizontal .wordle-row.new > *:nth-child(2){animation-delay:330ms}
body.horizontal .wordle-row.new > *:nth-child(3){animation-delay:660ms}
body.horizontal .wordle-row.new > *:nth-child(4){animation-delay:990ms}
body.horizontal .wordle-row.new > *:nth-child(5){animation-delay:1320ms}

/* ── PANEL DE CONTROL (fuera del reel, no se graba) ── */
#panel{
  position:fixed; top:12px; right:12px; width:380px; max-height:calc(100vh - 24px); overflow:auto;
  z-index:50; background:#1c1d24; color:#e9e9ef; border:1px solid #3a3b46; border-radius:12px;
  font:14px/1.4 system-ui, sans-serif; box-shadow:0 12px 40px rgba(0,0,0,.5); padding:14px; box-sizing:border-box;
}
body.nopanel #panel{display:none}
body.panel-only{overflow:auto; background:#121318}
body.panel-only #reel{display:none}
body.panel-only #panel{position:static; margin:24px auto; width:min(760px, calc(100% - 32px)); max-height:none;
  display:grid; grid-template-columns:1fr 1fr; gap:14px}
body.panel-only #panel > header, body.panel-only #panel > footer{grid-column:1 / -1}
#panel h2{margin:0; font-size:15px; letter-spacing:.04em}
#panel header{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px}
#view-menu{display:flex; gap:6px; margin:0 0 12px; flex-wrap:wrap}
#view-menu a{display:block; color:#fff; background:#343645; border-radius:7px; padding:6px 8px; text-decoration:none; font-size:12px}
#view-menu a:hover,#view-menu a.active{background:#2f6fe4}
#panel section{background:#25262f; border-radius:10px; padding:12px; margin-bottom:12px}
body.panel-only #panel section{margin:0}
body.panel-only #view-menu{grid-column:1 / -1}
#panel h3{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:#ffd84a}
#panel label{display:block; font-size:12px; color:#a9aab8; margin:8px 0 4px}
#panel .line{display:flex; gap:6px}
#panel input{flex:1; min-width:0; background:#14151b; color:#fff; border:1px solid #3a3b46; border-radius:7px; padding:7px 9px; font:inherit}
#panel input:focus{outline:2px solid #5b8cff; border-color:transparent}
#panel button{background:#343645; color:#fff; border:0; border-radius:7px; padding:7px 10px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap}
#panel button:hover{background:#44475a}
#panel button.primary{background:#2f6fe4} #panel button.primary:hover{background:#3d7cf0}
#panel button.danger{background:#6b2230} #panel button.danger:hover{background:#86293a}
#panel .msg{min-height:18px; font-size:12px; color:#ff8a80; margin-top:4px}
#panel .card{display:flex; gap:10px; align-items:center; background:#14151b; border-radius:8px; padding:6px; margin-top:6px; cursor:pointer}
#panel .card img{width:56px; height:56px; image-rendering:pixelated}
#panel .card.hide .inner{filter:blur(9px)}
#panel .card small{color:#a9aab8}
#panel ol{margin:8px 0 0; padding-left:22px; font-size:13px}
#panel ol li{margin:2px 0}
#panel .chips{font-family:monospace; margin-left:6px}
#panel .btns{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
#panel footer{font-size:12px; color:#8d8e9c}
#panel kbd{background:#343645; border-radius:4px; padding:1px 5px; font-size:11px}
</style>
</head>
<body class="horizontal">

<div id="reel">
  <div class="virtual" id="v-top"><span>BANNER · 1080×78</span></div>
  <div class="virtual" id="v-cams"><span>ESPACIO PARA CÁMARAS · 1920×482</span></div>

  <!-- ═════════ ZONA JUEGO (única interactiva) ═════════ -->
  <div id="game">
    <div class="cloud" style="width:150px;left:60px;top:190px"></div>
    <div class="cloud" style="width:190px;left:330px;top:470px"></div>
    <div class="cloud" style="width:130px;left:640px;top:260px"></div>
    <div class="cloud" style="width:210px;left:840px;top:560px"></div>
    <div class="cloud" style="width:120px;left:120px;top:640px"></div>

    <div class="half l" data-side="0"></div>
    <div class="divider"></div>
    <div class="half r" data-side="1"></div>
  </div>

  <div class="virtual" id="v-bottom"><span>BANNER + LOGO · 1080×270</span></div>
</div>

<!-- ═════════ PANEL DE CONTROL ═════════ -->
<aside id="panel">
  <header>
    <h2>⚙ Panel · Poké-Duelo</h2>
    <div class="line">
      <button id="btn-sound" title="Activar o silenciar efectos">🔊</button>
      <button id="btn-popout" title="Abrir el panel en otra pestaña">↗ Pestaña</button>
      <button id="btn-reset" class="danger">Nueva ronda</button>
    </div>
  </header>
  <nav id="view-menu" aria-label="Vistas de la partida"></nav>
  <section id="cats-panel"><h3>Categorías · TIPOS + 3</h3><div class="line" id="cats-selects"></div></section>
  <div id="panel-sides"></div>
  <section id="online-session" hidden></section>
  <footer>
    <kbd>R</kbd> grabación 1:1 · <kbd>G</kbd> guías · <kbd>P</kbd> panel<br>
    En pantalla se ven hasta los últimos cinco intentos de cada jugador.
    Hacé clic en la carta del secreto para verla/ocultarla.
  </footer>
</aside>
<datalist id="dex"></datalist>

function findPoke(q){
  q = q.trim(); if(!q) return null;
  let m = q.match(/#\s*(\d+)\s*$/) || q.match(/^\s*#?(\d+)\s*$/);
  if(m) return BY[+m[1]] || null;
  const n = norm(q);

  const starts = DEX.filter(p=>norm(p.name).startsWith(n));

}

    [523, 659, 784, 659].forEach((note, i)=>tone(note, now+((i+1)*CELL_DELAY/1000), .07, .035));
    const end = now + (6*CELL_DELAY+520)/1000;
    if(win){ [523,659,784,1047].forEach((note,i)=>tone(note,end+i*.07,.20,.055,'triangle')); }
    else { tone(294,end,.16,.045,'triangle'); tone(220,end+.13,.25,.04,'triangle'); }
  }catch(_){}
}
function updateSoundButton(){
  const button = document.getElementById('btn-sound');
  if(button) { button.textContent = soundMuted ? '🔇' : '🔊'; button.title = soundMuted ? 'Activar efectos' : 'Silenciar efectos'; }
}

function onlineReady(){ return !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey && window.supabase); }
function saveOnline(){
  if(!db || !gameId) return;
  db.from('pokeduelo_games').upsert({id:gameId, state:S}).then(({error})=>{
    if(error) setOnlineMessage(`No se pudo guardar: ${error.message}`);
  });
}
function setOnlineMessage(text){
  const box = document.getElementById('online-session');
  if(box && text) { box.hidden=false; box.textContent=text; }
}
function shareUrl(player){
  const url = new URL(location.href);
  url.searchParams.set('game', gameId);
  url.searchParams.set('player', player);
  return url.href;
}
function viewUrl(view){
  const url = new URL(location.href);
  if(gameId) url.searchParams.set('game', gameId);
  url.searchParams.delete('player');
  url.searchParams.delete('view');
  if(view === 'j1') url.searchParams.set('player', '1');
  if(view === 'j2') url.searchParams.set('player', '2');
  if(view === 'spectator') url.searchParams.set('view', 'spectator');
  return url.href;
}
function showViewMenu(){
  const menu = document.getElementById('view-menu');
  if(!menu) return;
  const active = spectatorView ? 'spectator' : playerView === 0 ? 'j1' : playerView === 1 ? 'j2' : 'admin';
  menu.innerHTML = [['admin','Admin'],['j1','SKY'],['j2','GUTI'],['spectator','Espectador']]
    .map(([view,label])=>`<a class="${active===view?'active':''}" href="${viewUrl(view)}">${label}</a>`).join('');
}
function showShareLinks(){
  const box = document.getElementById('online-session');
  if(!box || !gameId) return;
  box.hidden = false;
  box.innerHTML = `<h3>Partida en línea</h3><p>Compartí una vista con cada persona:</p>
    <p><a href="${viewUrl('j1')}" target="_blank" rel="noopener">SKY</a> · <a href="${viewUrl('j2')}" target="_blank" rel="noopener">GUTI</a></p>
    <p><a href="${viewUrl('admin')}" target="_blank" rel="noopener">Admin</a> · <a href="${viewUrl('spectator')}" target="_blank" rel="noopener">Espectador / grabación</a></p>`;
}
async function initOnline(){
  if(!onlineReady()) return;
  db = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
  if(!gameId){
    gameId = crypto.randomUUID();
    const url = new URL(location.href);
    url.searchParams.set('game', gameId);
    history.replaceState(null, '', url);
  }
  const {data, error} = await db.from('pokeduelo_games').select('state').eq('id', gameId).maybeSingle();
  if(error){ setOnlineMessage(`No se pudo abrir la partida: ${error.message}`); return; }
  if(data && data.state){ S = data.state; renderAll(); }
  else {
    const {error: createError} = await db.from('pokeduelo_games').insert({id:gameId, state:S});
    if(createError){ setOnlineMessage(`No se pudo crear la partida: ${createError.message}`); return; }
  }
  db.channel(`pokeduelo-${gameId}`)
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'pokeduelo_games', filter:`id=eq.${gameId}`}, payload=>receive(payload.new.state))
    .subscribe();
  if(playerView === null && !spectatorView) showShareLinks();
  showViewMenu();
}

/* ─────────── JUEGO ─────────── */
const CELL_DELAY = 330;
const lastShown = [undefined, undefined]; // undefined = primer render, sin animación
const lastAnimatedGuess = [null, null];
const halves = [...document.querySelectorAll('.half')];

/* La fase viene precalculada en EXTRA desde la cadena evolutiva oficial: así no hay
   un valor provisorio (FASE 1) que se muestre antes de saber si la especie es ÚNICA. */
const phaseFor = p => p.phase ? `FASE ${p.phase}` : 'ÚNICA';

function evaluate(p, t){
  /* Cada tipo ocupa su propia casilla; un hueco de tipo secundario queda neutro. */
  const types = [0,1].map(slot=>{
    const ty = p.ty[slot];
    if(ty === undefined) return {ok:null, html:`<div class="none outline">—</div>`};
    return {ok:t.ty.includes(ty), html:`<div class="tb" style="background:${TYPES[ty].c}">${TYPES[ty].n.toUpperCase()}</div>`};
  });
  return {types, cells:activeCats().map(k=>CATS[k].cell(p,t))};
}

/* ─────────── CATEGORÍAS ───────────
   TIPOS es fija; las otras 3 casillas se eligen en el panel entre estas. */
/* ▲ = el secreto tiene más; ▼ = tiene menos. */
const arrow = (a,b) => a===b ? '' : `<span class="arrow">${b > a ? '▲' : '▼'}</span>`;
const text = (value, cls='big') => `<div class="${cls} outline">${value}</div>`;
const initialFor = p => (norm(p.name).charAt(0) || '').toUpperCase();
const CATS = {
  gen:      {label:'GEN',      cell:(p,t)=>({ok:p.gen===t.gen, html:text(p.gen)})},
  inicial:  {label:'INICIAL',  option:'LETRA INICIAL', cell:(p,t)=>({ok:initialFor(p)===initialFor(t), html:text(initialFor(p))})},
  fase:     {label:'FASE',     cell:(p,t)=>({ok:phaseFor(p)===phaseFor(t), html:text(phaseFor(p))})},
  color:    {label:'COLOR',    cell:(p,t)=>({ok:p.col===t.col, html:`<div class="sw" style="background:${COLORS[p.col].c}"></div>${text(COLORS[p.col].n.toUpperCase(),'cname')}`})},
  /* Experimental: no es un dato oficial, sale del color que más ocupa el sprite después del oficial. */
  color2:   {label:'COLOR 2',  option:'COLOR 2 (prueba)', cell:(p,t)=>({ok:p.col2===t.col2, html:p.col2 ? `<div class="sw" style="background:${COLORS[p.col2-1].c}"></div>${text(COLORS[p.col2-1].n.toUpperCase(),'cname')}` : text('NINGUNO','cname txt')})},
  altura:   {label:'ALTURA',   cell:(p,t)=>({ok:p.h===t.h, html:text(`${decimal(p.h)} M${arrow(p.h,t.h)}`)})},
  peso:     {label:'PESO',     cell:(p,t)=>({ok:p.w===t.w, html:text(`${decimal(p.w)} KG${arrow(p.w,t.w)}`)})},
  mega:     {label:'MEGA',     cell:(p,t)=>({ok:p.mega===t.mega, html:p.mega === 2 ? text('SU EVOLUCIÓN','cname txt') : text(p.mega ? 'SÍ' : 'NO')})},
  regional: {label:'REGIONAL', cell:(p,t)=>({ok:p.reg===t.reg, html:text(regionText(p),'cname txt')})},
  mejorstat:{label:'MEJOR STAT', cell:(p,t)=>({ok:p.best===t.best, html:text(bestStats(p).join('<br>'),'cname txt')})},
  metodo:   {label:'MÉTODO',   cell:(p,t)=>({ok:p.evo===t.evo && !!p.evoPlus===!!t.evoPlus, html:text(`${METHODS[p.evo]}${p.evoPlus ? ' +' : ''}`,'cname txt')})}
};
const activeCats = () => Array.isArray(S.cats) && S.cats.length === 3 && S.cats.every(k=>CATS[k]) ? S.cats : DEFAULT_CATS;
const catLabels = () => activeCats().map(k=>CATS[k].label);

function renderSideHorizontal(i, t, guesses, animate){
  const h = halves[i];
  const player = PLAYER_NAMES[i];
  if(!t){
    h.classList.remove('win');
    h.innerHTML = `<div class="wordle-board"><div class="wordle-head"><h3 class="outline">${player}</h3><span>ESPERANDO SECRETO</span></div><div class="wordle-empty outline">El rival todavía no fijó su Pokémon secreto.</div></div>`;
    return;
  }
  const visibleGuesses = guesses.slice(-5).reverse();
  const solved = guesses.length > 0 && guesses[guesses.length-1] === t.id;
  h.classList.toggle('win', solved);
  const rows = visibleGuesses.map((id,index)=>{
    const p = BY[id], result = evaluate(p,t), latest = index === 0;
    const cell = c => `<div class="wordle-cell ${c.ok===null?'empty':c.ok?'ok':'no'}">${c.html}</div>`;
    return `<div class="wordle-row ${latest?'recent':''} ${p.id===t.id?'solved':''}${latest && animate?' new':''}">
      <div class="wordle-poke"><img src="${sprite(p.id)}" alt="${p.name}"></div>
      <div class="wordle-types">${result.types.map(cell).join('')}</div>
      ${result.cells.map(cell).join('')}
    </div>`;
  }).join('');
  const count = `${guesses.length} INTENTO${guesses.length===1?'':'S'}`;
  const result = guesses.length ? `<div class="wordle-result ${solved?'win':'try'} outline${animate?' anim':''}">${solved?'¡ADIVINADO!':'¡SEGUÍ INTENTANDO!'}</div>` : '';
  /* Mismo momento que el cartel y el sonido final de la versión vertical. */
  h.innerHTML = `<div class="wordle-board" style="--reveal-end:${6*CELL_DELAY+520}ms"><div class="wordle-head"><h3 class="outline">${player}</h3>${result}<span>${count}</span></div>
    <div class="wordle-labels"><span>POKÉMON</span><span>TIPOS</span>${catLabels().map(l=>`<span>${l}</span>`).join('')}</div>
    <div class="wordle-list">${rows || '<div class="wordle-empty outline">Hacé tu primer intento.</div>'}</div></div>`;
  const list = h.querySelector('.wordle-list');
  if(list) list.scrollTop = 0;
}

function renderSide(i){
  const h = halves[i];
  const g = S.guesses[i];
  const t = BY[S.secret[1-i]];
  const p = t && g.length ? BY[g[g.length-1]] : null;
  const key = p ? `${g.length}:${p.id}:${t.id}:${activeCats()}` : `-:${activeCats()}`;
  const guessKey = p ? `${g.length}:${p.id}` : null;
  if(key === lastShown[i]) return;
  /* Cada intento nuevo —incluido el primero— revela el Pokémon y las casillas. */
  const animate = !!p && guessKey !== lastAnimatedGuess[i];
  lastShown[i] = key;
  if(p) lastAnimatedGuess[i] = guessKey;
  else lastAnimatedGuess[i] = null;

  if(document.body.classList.contains('horizontal')){
    renderSideHorizontal(i, t, g, animate);
    if(animate) playReveal(p.id === t.id);
    return;
  }

  const win = p && p.id === t.id;
  /* Acierto y error comparten exactamente el mismo ritmo de revelación. */
  const revealRate = 1;
  const a = (cls, d) => animate ? ` ${cls}" style="animation-delay:${d * revealRate}ms;animation-duration:620ms` : '';
  h.classList.toggle('win', !!win);
  if(animate) playReveal(win);

  if(!p){
    h.innerHTML = `<div class="tile sprite empty"><div class="q outline">?</div></div>
      <div class="checks"><div class="check types"><div class="lbl outline">TIPOS</div><div class="type-tiles"><div class="tile empty"></div><div class="tile empty"></div></div></div>${catLabels().map(l=>`<div class="check"><div class="lbl outline${l.length>7?' long':''}">${l}</div><div class="tile empty"></div></div>`).join('')}</div>`;
    return;
  }
  const result = evaluate(p,t);
  h.innerHTML = `<div class="tile sprite${animate?' anim-pop':''}" style="background:color-mix(in srgb, ${TYPES[p.ty[0]].c} 40%, #fff);${animate?'animation-duration:480ms':''}"><img src="${sprite(p.id)}" alt=""></div>
    <div class="checks"><div class="check types"><div class="lbl outline">TIPOS</div><div class="type-tiles">${result.types.map((c,k)=>`<div class="tile ${c.ok===null?'empty':c.ok?'ok':'no'}${a('anim-flip',(k+1)*CELL_DELAY)}">${c.html}</div>`).join('')}</div></div>${result.cells.map((c,k)=>`<div class="check"><div class="lbl outline${catLabels()[k].length>7?' long':''}">${catLabels()[k]}</div>
      <div class="tile ${c.ok?'ok':'no'}${a('anim-flip',(k+3)*CELL_DELAY)}">${c.html}</div></div>`).join('')}</div>
    <div class="resultbanner ${win?'win':'try'} outline${animate?' anim':''}" style="animation-delay:${(6*CELL_DELAY+520)*revealRate}ms;${animate?'animation-duration:720ms':''}">${win?'¡ADIVINADO!':'¡SEGUÍ INTENTANDO!'}</div>`;
}

/* ─────────── PANEL ─────────── */
const dl = document.getElementById('dex');
dl.innerHTML = DEX.map(p=>`<option value="${p.name} #${p.id}">`).join('');

const psides = document.getElementById('panel-sides');
psides.innerHTML = [0,1].map(i=>`
  <section data-p="${i}">
    <h3>${PLAYER_NAMES[i]} · ${i?'derecha':'izquierda'}</h3>
    <label>Pokémon secreto de ${PLAYER_NAMES[i]} (lo adivina ${PLAYER_NAMES[1-i]})</label>
    <div class="line"><input data-k="secret" list="dex" placeholder="Nombre o número"><button data-k="set-secret">Fijar</button></div>
    <div class="card hide" data-k="card" title="Clic para ver/ocultar"></div>
    <label>Intento de ${PLAYER_NAMES[i]}</label>
    <div class="line"><input data-k="guess" list="dex" placeholder="Nombre o número + Enter"><button class="primary" data-k="go">Validar</button></div>
    <div class="msg" data-k="msg"></div>
    <div class="btns"><button data-k="undo">↶ Deshacer</button><button data-k="clear">Borrar intentos</button></div>
    <ol data-k="hist"></ol>
  </section>`).join('');

/* Categorías: 3 selectores sin repetidos; elegir una ya usada la intercambia de casilla. */
const catSelects = document.getElementById('cats-selects');
catSelects.innerHTML = [0,1,2].map(slot=>`<select data-slot="${slot}" aria-label="Categoría ${slot+1}">
  ${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.option || c.label}</option>`).join('')}</select>`).join('');
catSelects.addEventListener('change', e=>{
  const slot = +e.target.dataset.slot, value = e.target.value;
  const cats = [...activeCats()], other = cats.indexOf(value);
  if(other !== -1) cats[other] = cats[slot];
  cats[slot] = value;
  S.cats = cats; commit();
});
function renderCats(){
  activeCats().forEach((k,slot)=>{ catSelects.querySelector(`[data-slot="${slot}"]`).value = k; });
}

/* En un enlace de jugador se muestra sólo su sección del panel. */
if(playerView !== null){
  [...psides.querySelectorAll('section')].forEach((section, i)=>section.hidden = i !== playerView);
  document.getElementById('online-session').hidden = true;
  document.getElementById('cats-panel').hidden = true;
}
if(spectatorView) document.body.classList.add('nopanel', 'clean');

const q = (i,k) => psides.querySelector(`[data-p="${i}"] [data-k="${k}"]`);
const say = (i,txt) => { q(i,'msg').textContent = txt; };

[0,1].forEach(i=>{
  const setSecret = ()=>{
    const p = findPoke(q(i,'secret').value);
    if(!p){ say(i,'Pokémon secreto no encontrado.'); return; }
    S.secret[i] = p.id; q(i,'secret').value=''; say(i,''); commit();
  };
  q(i,'set-secret').onclick = setSecret;
  q(i,'secret').addEventListener('keydown', e=>{ if(e.key==='Enter') setSecret(); });

  const go = ()=>{
    const p = findPoke(q(i,'guess').value);
    if(!p){ say(i,'Pokémon no encontrado.'); return; }
    if(!S.secret[1-i]){ say(i,`Falta fijar el secreto de ${PLAYER_NAMES[1-i]}.`); return; }
    if(S.guesses[i].includes(p.id)){ say(i,`${p.name} ya fue intentado.`); return; }
    S.guesses[i].push(p.id); q(i,'guess').value=''; say(i,''); commit();
  };
  q(i,'go').onclick = go;
  q(i,'guess').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });

  q(i,'undo').onclick = ()=>{ S.guesses[i].pop(); commit(); };
  q(i,'clear').onclick = ()=>{ if(confirm(`¿Borrar los intentos de ${PLAYER_NAMES[i]}?`)){ S.guesses[i]=[]; commit(); } };
  q(i,'card').onclick = e=> e.currentTarget.classList.toggle('hide');
});

document.getElementById('btn-reset').onclick = ()=>{
  if(!confirm('¿Iniciar una nueva ronda? Se borran los secretos e intentos de ambos jugadores.')) return;
  S = {...fresh(), cats:[...activeCats()]}; // la nueva ronda conserva las categorías
  lastShown[0] = lastShown[1] = undefined;
  lastAnimatedGuess[0] = lastAnimatedGuess[1] = null;
  commit();
};
document.getElementById('btn-sound').onclick = ()=>{
  soundMuted = !soundMuted;
  localStorage.setItem('pokeduelo-muted', soundMuted ? '1' : '0');
  updateSoundButton();
};
document.getElementById('btn-popout').onclick = ()=> window.open(location.href.split('#')[0] + '#panel', '_blank');

function renderPanel(i){
  const s = BY[S.secret[i]], card = q(i,'card');
  card.style.display = s ? '' : 'none';
  if(s) card.innerHTML = `<div class="inner" style="display:flex;gap:10px;align-items:center">
      <img src="${sprite(s.id)}" alt=""><div><b>${s.name}</b> #${s.id}<br>
      <small>${s.ty.map(t=>TYPES[t].n).join(' / ')} · Gen ${s.gen} · ${phaseFor(s)} · ${COLORS[s.col].n}${s.col2 ? ' + ' + COLORS[s.col2-1].n : ''}<br>${decimal(s.h)} m · ${decimal(s.w)} kg · Mega: ${MEGA_TEXT[s.mega]} · Regional: ${regionText(s).toLowerCase()} · ${METHODS[s.evo].toLowerCase()} · Mejor stat: ${bestStats(s).join(' + ').toLowerCase()}</small></div></div>`;
  const t = BY[S.secret[1-i]];
  q(i,'hist').innerHTML = S.guesses[i].map(id=>{
    const p = BY[id];
    const result = t ? evaluate(p,t) : null;
    const chips = result ? [...result.types, ...result.cells].map(c=>c.ok===null?'⬜':c.ok?'🟩':'🟥').join('') + (p.id===t.id?' 🏆':'') : '';
    return `<li>${p.name}<span class="chips">${chips}</span></li>`;
  }).join('');
}

function renderAll(){ renderCats(); [0,1].forEach(i=>{ renderSide(i); renderPanel(i); }); }

/* ─────────── ESCALA / TECLAS ─────────── */
const reel = document.getElementById('reel');
function reelHeight(){
  const cs = getComputedStyle(document.documentElement);
  return ['--h-banner-top','--h-cams','--h-game','--h-banner-bottom'].reduce((a,v)=>a+parseFloat(cs.getPropertyValue(v)),0);
}
function fit(){
  if(document.body.classList.contains('rec')){ reel.style.transform=''; return; }
  const s = Math.min(innerWidth/1080, innerHeight/reelHeight(), 1);
  reel.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);

addEventListener('keydown', e=>{
  if(e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==='r'){ document.body.classList.toggle('rec'); scrollTo(0,0); fit(); }
  else if(k==='g'){ document.body.classList.toggle('clean'); }
  else if(k==='p'){ document.body.classList.toggle('nopanel'); }
});

if(location.hash === '#panel') document.body.classList.add('panel-only');
fit();
updateSoundButton();
renderAll();
initOnline();
</script>
</body>
